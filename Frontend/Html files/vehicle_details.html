<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DriveEase - Vehicle Details</title>

    <link rel="stylesheet" href="../Css Files/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav>
            <h2>DriveEase</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="vehicles.html">Vehicles</a></li>
                <li><a href="my_rentals.html">My Rentals</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>


    <!-- Vehicle Details -->
    <section class="details-section">

        <!-- Vehicle Image -->
        <div class="details-image">
            🚗
        </div>


        <!-- Vehicle Information -->
        <div class="details-info">

            <h1 id="vehicleName">
                Loading...
            </h1>

            <p class="vehicle-type" id="vehicleType">
                Loading...
            </p>

            <h2 id="vehiclePrice">
                Loading...
            </h2>

            <p id="vehicleDescription">
                Find the perfect vehicle for your journey.
            </p>


            <!-- Vehicle Specifications -->
            <div class="vehicle-specifications">

                <p>
                    <strong>Fuel:</strong>
                    <span id="fuelType">Loading...</span>
                </p>

                <p>
                    <strong>Transmission:</strong>
                    <span id="transmission">Loading...</span>
                </p>

                <p>
                    <strong>Seats:</strong>
                    <span id="seats">Loading...</span>
                </p>

                <p>
                    <strong>Status:</strong>
                    <span id="status">Loading...</span>
                </p>

            </div>


            <!-- Rent Button -->
            <a id="rentButton" href="#" class="btn">
                Rent Now
            </a>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 DriveEase. All rights reserved.
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="../Javascript Files/vehicle_details.js"></script>

</body>

</html>
