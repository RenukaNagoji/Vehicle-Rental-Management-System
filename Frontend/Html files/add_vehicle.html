<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DriveEase - Add Vehicle</title>

    <link rel="stylesheet"
          href="../Css Files/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <header>

        <nav>

            <h2>DriveEase</h2>

            <ul>

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="vehicles.html">Vehicles</a>
                </li>

                <li>
                    <a href="admin.html">Admin Dashboard</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- ADD VEHICLE -->

    <section class="edit-vehicle-section">

        <div class="edit-vehicle-container">

            <h1>Add New Vehicle</h1>

            <p>
                Enter the details of the new vehicle.
            </p>


            <form id="addVehicleForm"
                  class="edit-vehicle-form">

                <label for="vehicleName">
                    Vehicle Name
                </label>

                <input
                    type="text"
                    id="vehicleName"
                    placeholder="Enter vehicle name"
                    required
                >


                <label for="vehicleType">
                    Vehicle Type
                </label>

                <select id="vehicleType" required>

                    <option value="">
                        Select vehicle type
                    </option>

                    <option value="Car">
                        Car
                    </option>

                    <option value="Bike">
                        Bike
                    </option>

                    <option value="Scooter">
                        Scooter
                    </option>

                    <option value="SUV">
                        SUV
                    </option>

                    <option value="Luxury">
                        Luxury
                    </option>

                </select>


                <label for="price">
                    Price Per Day
                </label>

                <input
                    type="number"
                    id="price"
                    placeholder="Enter price per day"
                    required
                >


                <label for="fuel">
                    Fuel Type
                </label>

                <select id="fuel" required>

                    <option value="">
                        Select fuel type
                    </option>

                    <option value="Petrol">
                        Petrol
                    </option>

                    <option value="Diesel">
                        Diesel
                    </option>

                    <option value="Electric">
                        Electric
                    </option>

                    <option value="CNG">
                        CNG
                    </option>

                </select>


                <label for="transmission">
                    Transmission
                </label>

                <select id="transmission" required>

                    <option value="">
                        Select transmission
                    </option>

                    <option value="Manual">
                        Manual
                    </option>

                    <option value="Automatic">
                        Automatic
                    </option>

                </select>


                <label for="seats">
                    Number of Seats
                </label>

                <input
                    type="number"
                    id="seats"
                    placeholder="Enter number of seats"
                    required
                >


                <div class="edit-vehicle-buttons">

                    <button
                        type="submit"
                        class="update-vehicle-btn">

                        Add Vehicle

                    </button>


                    <a
                        href="admin.html"
                        class="cancel-vehicle-btn">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 DriveEase. All rights reserved.
        </p>

    </footer>


    <script src="../Javascript Files/add_vehicle.js"></script>

</body>

</html>
