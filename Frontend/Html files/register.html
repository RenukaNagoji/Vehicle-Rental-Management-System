<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DriveEase - Register</title>

    <link rel="stylesheet" href="../Css Files/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav>
            <h2>DriveEase</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="vehicles.html">Vehicles</a></li>
                <li><a href="my_rentals.html">My Rentals</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>


    <!-- Registration Section -->
    <section class="auth-section">

        <div class="auth-container">

            <h1>Create Account</h1>

            <p>Register to start renting vehicles with DriveEase.</p>


            <form id="registerForm">

                <!-- Name -->
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- Email -->
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Phone -->
                <label for="phone">Phone Number</label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >


                <!-- Password -->
        <label for="password">Password</label>

       <div class="password-container">
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <span class="toggle-password" onclick="togglePassword('password', this)">
                👁
            </span>
        </div>


        <!--   Confirm Password -->
        <label for="confirmPassword">Confirm Password</label>

        <div class="password-container">
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >

            <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                👁
            </span>
        </div>


                <!-- Register Button -->
                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>


            <!-- Login Link -->
            <p class="auth-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 DriveEase. All rights reserved.</p>
    </footer>


    <!-- JavaScript -->
    <script src="../Javascript Files/register.js"></script>

</body>
</html>
